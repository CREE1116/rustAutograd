[package]
name = "rg"
version = "0.2.0"
edition = "2021"
description = "Define mathematics in Python; differentiate, compile, validate and run it in Rust"
repository = "https://github.com/CREE1116/rustAutograd"

[lib]
name = "rg"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]
# Use the pure-Rust kernels instead of Accelerate, to test what non-macOS platforms run.
portable = []

[dependencies]
serde_json = "1"
rayon = "1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-metal-performance-shaders = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
